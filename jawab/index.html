<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>جاوب - ألعاب تعليمية</title>
  <meta name="description" content="جاوب: منصة ألعاب تعليمية عربية للأطفال والطلاب">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="logo" data-nav="home" aria-label="الرئيسية">
      <span class="logo-mark">ج</span>
      <span class="logo-text">جاوب</span>
    </button>
    <div class="player-info">
      <span id="player-name" class="player-name"></span>
      <span class="stat" title="النقاط">⭐ <b id="total-points">0</b></span>
      <span class="stat" title="المستوى">🏆 <b id="player-level">1</b></span>
    </div>
  </header>

  <main id="app">
    <!-- Welcome -->
    <section id="screen-welcome" class="screen">
      <div class="card welcome">
        <div class="big-logo">ج</div>
        <h1>أهلاً بك في <span class="accent">جاوب</span></h1>
        <p>تعلّم وأنت تلعب! اختر لعبة، جاوب صح، واجمع النجوم.</p>
        <form id="welcome-form">
          <label for="name-input">ما اسمك؟</label>
          <input id="name-input" maxlength="20" placeholder="اكتب اسمك هنا" required autocomplete="off">
          <button class="btn primary" type="submit">يلا نبدأ 🚀</button>
        </form>
      </div>
    </section>

    <!-- Home -->
    <section id="screen-home" class="screen">
      <h2 class="section-title">اختر لعبتك</h2>
      <div id="games-grid" class="games-grid"></div>
    </section>

    <!-- Game -->
    <section id="screen-game" class="screen">
      <div class="game-header">
        <button class="btn ghost" data-nav="home">→ رجوع</button>
        <h2 id="game-title"></h2>
        <div class="game-stats">
          <span>النتيجة: <b id="game-score">0</b></span>
          <span id="game-timer" class="timer" hidden></span>
        </div>
      </div>
      <div class="progress"><div id="game-progress" class="progress-bar"></div></div>
      <div id="game-area" class="card game-area"></div>
    </section>

    <!-- Result -->
    <section id="screen-result" class="screen">
      <div class="card result">
        <div id="result-emoji" class="result-emoji"></div>
        <h2 id="result-title"></h2>
        <p id="result-text"></p>
        <div id="result-stars" class="stars"></div>
        <div class="actions">
          <button id="btn-replay" class="btn primary">العب مرة أخرى</button>
          <button class="btn" data-nav="home">الألعاب</button>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/games/quiz.js"></script>
  <script src="js/games/math.js"></script>
  <script src="js/games/truefalse.js"></script>
  <script src="js/games/memory.js"></script>
  <script src="js/games/letters.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
