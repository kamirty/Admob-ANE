<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Lalezar&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{width:1080px;height:1080px;overflow:hidden}
body{width:1080px;height:1080px;overflow:hidden;font-family:Cairo,sans-serif;background:#0a0a0b;color:#fff;position:relative}
.bg{position:absolute;inset:0;background:
 radial-gradient(circle at 50% 8%,rgba(255,212,0,.22),transparent 45%),
 radial-gradient(circle at 50% 70%,rgba(255,212,0,.10),transparent 55%),
 radial-gradient(circle,rgba(255,255,255,.06) 1px,transparent 1.5px) 0 0/26px 26px}
.spark{position:absolute;color:#ffd400;opacity:.9}
.top{position:absolute;top:46px;left:0;right:0;text-align:center}
.pill{display:inline-block;border:2px solid #ffd400;color:#ffd400;border-radius:99px;padding:6px 26px;font-weight:800;font-size:24px;letter-spacing:.3px}
.brand{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:14px}
.brand h1{font-family:Lalezar,sans-serif;font-weight:400;font-size:150px;line-height:1.05;
 background:linear-gradient(100deg,#9a6c12 0%,#ffe680 25%,#d8a531 45%,#fff6c2 58%,#c58f22 75%,#ffdf6e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 18px rgba(255,200,0,.25))}
.sub{font-size:56px;font-weight:900;margin-top:-6px}
.tag{font-size:29px;color:#d6d6d6;margin-top:8px;font-weight:600}
.tag b{color:#ffd400}
.fan{position:absolute;top:462px;left:540px;width:0;height:0;direction:ltr}
.fan img{position:absolute;left:0;top:0;width:520px;border-radius:6px;box-shadow:0 26px 60px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.08)}
.f1{transform:translate(-50%,0) translate(-230px,26px) rotate(-9deg)}
.f2{transform:translate(-50%,0) translate(230px,26px) rotate(9deg)}
.f3{transform:translate(-50%,0) translate(0,-6px);z-index:2}
.chips{position:absolute;top:878px;left:0;right:0;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:0 40px}
.chip{background:#18181a;border:1px solid rgba(255,212,0,.45);border-radius:14px;padding:6px 16px;font-size:22px;font-weight:700;white-space:nowrap}
.chip i{font-style:normal;color:#ffd400;margin-left:6px}
.cta{position:absolute;bottom:0;left:0;right:0;height:96px;background:#ffd400;color:#000;display:flex;align-items:center;justify-content:space-between;padding:0 48px}
.cta .go{font-size:38px;font-weight:900}
.cta .url{font-size:34px;font-weight:900;direction:ltr;background:#000;color:#ffd400;padding:4px 22px;border-radius:12px}
</style></head><body>
