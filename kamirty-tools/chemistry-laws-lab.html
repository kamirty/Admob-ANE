<!-- مختبر قوانين الكيمياء التفاعلي — Kamirty.ai — الصق هذا الكود كاملًا في وضع "عرض HTML" في بلوجر -->
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
#kcl{--ink:#0e1013;--ink2:#151920;--ink3:#1c2129;--line:#2a313a;--gold:#d9ad3c;--gold2:#f2c95c;--tx:#ece8de;--mu:#9aa1a9;--ok:#5cc489;--bad:#e26d5a;
font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--ink);color:var(--tx);border:1px solid var(--line);border-radius:18px;padding:18px;line-height:1.65;max-width:1100px;margin:0 auto;direction:rtl;text-align:right;font-size:15px;
background-image:linear-gradient(rgba(217,173,60,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(217,173,60,.035) 1px,transparent 1px);background-size:28px 28px}
#kcl *,#kcl *::before,#kcl *::after{box-sizing:border-box}
#kcl h2,#kcl h3,#kcl p{margin:0;padding:0;border:0;background:none;color:inherit;font-family:inherit}
#kcl button,#kcl select,#kcl input{font-family:inherit;font-size:14px;color:var(--tx);margin:0}
#kcl:fullscreen{max-width:none;border-radius:0;overflow:auto;height:100%}
.kcl-hd{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.kcl-hd svg{flex:none;width:46px;height:46px}
.kcl-hd h2{font-size:24px;font-weight:800;line-height:1.3;color:var(--tx)}
.kcl-hd h2 span{color:var(--gold)}
.kcl-hd p{color:var(--mu);font-size:14px}
.kcl-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.kcl-search{flex:1 1 200px;min-width:0;background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none}
.kcl-search:focus{border-color:var(--gold)}
.kcl-cats,.kcl-list{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}
.kcl-cats{flex:1 1 100%}
.kcl-chip{flex:none;cursor:pointer;background:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:6px 13px;white-space:nowrap;transition:.15s}
.kcl-chip:hover{border-color:var(--gold)}
.kcl-chip.on{background:var(--gold);color:#16130a;border-color:var(--gold);font-weight:700}
.kcl-list{flex-wrap:wrap;overflow:visible;margin-bottom:16px}
.kcl-list .kcl-chip{border-radius:9px;font-size:14px}
.kcl-list .kcl-chip.on{background:transparent;color:var(--gold2);border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.kcl-empty{color:var(--mu);padding:6px}
.kcl-lab{background:rgba(21,25,32,.85);border:1px solid var(--line);border-radius:16px;padding:16px}
.kcl-lh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.kcl-tag{display:inline-block;font-size:12px;color:var(--gold);border:1px solid rgba(217,173,60,.45);border-radius:6px;padding:1px 8px;margin-bottom:4px}
.kcl-lh h3{font-size:22px;font-weight:800;line-height:1.35}
.kcl-by{color:var(--mu);font-size:13px}
.kcl-btns{display:flex;gap:6px}
.kcl-btn{cursor:pointer;background:var(--ink3);border:1px solid var(--line);border-radius:9px;padding:6px 12px}
.kcl-btn:hover{border-color:var(--gold);color:var(--gold2)}
.kcl-law{margin:10px 0!important;font-size:16px}
.kcl-fm{direction:ltr;text-align:center;font-family:ui-monospace,'Cascadia Code',Consolas,'Courier New',monospace;font-size:18px;color:var(--gold2);background:var(--ink);border:1px dashed rgba(217,173,60,.45);border-radius:12px;padding:10px;margin-bottom:14px;overflow-x:auto;white-space:pre}
.kcl-fm.ar{direction:rtl;font-family:inherit;white-space:normal}
.kcl-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:14px}
.kcl-stage{display:flex;flex-direction:column;gap:10px;min-width:0}
.kcl-stage canvas{display:block;width:100%;max-width:100%;border-radius:12px;background:#0a0c0f;border:1px solid var(--line);margin:0;padding:0}
.kcl-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.kcl-ctrls{display:flex;flex-direction:column;gap:10px;background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px}
.kcl-c label{font-size:14px;color:var(--tx)}
.kcl-cr{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.kcl-cr output{font-family:ui-monospace,Consolas,monospace;color:var(--gold2);font-size:14px;white-space:nowrap}
.kcl-c input[type=range]{direction:ltr;width:100%;accent-color:var(--gold);cursor:pointer;height:22px;background:transparent;border:0;padding:0}
.kcl-c select{width:100%;margin-top:4px;background:var(--ink2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer}
.kcl-outs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.kcl-o{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0}
.kcl-o span{display:block;font-size:12.5px;color:var(--mu);line-height:1.45}
.kcl-o b{display:block;font-size:18px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kcl-o.k{border-color:rgba(217,173,60,.6);background:rgba(217,173,60,.07)}
.kcl-o.k b{color:var(--gold2)}
.kcl-note{font-size:14px;color:var(--tx);border-inline-start:3px solid var(--gold);background:rgba(217,173,60,.06);padding:8px 12px;border-radius:8px}
.kcl-ex{margin-top:14px;font-size:14.5px;color:var(--tx)}
.kcl-ex b{color:var(--gold)}
.kcl-q{margin-top:10px;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.kcl-q summary{cursor:pointer;color:var(--gold2);font-weight:700}
.kcl-q p{margin-top:6px!important}
.kcl-q .kcl-a{color:var(--ok);margin-top:6px!important}
.kcl-ft{margin-top:14px;text-align:center;font-size:13px;color:var(--mu)}
.kcl-ft a{color:var(--gold);text-decoration:none}
#kcl bdi{unicode-bidi:isolate}
.kcl-note bdi{white-space:nowrap}
@media (max-width:760px){
#kcl{padding:12px;border-radius:14px}
.kcl-grid{grid-template-columns:minmax(0,1fr)}
.kcl-hd h2{font-size:20px}
.kcl-lh h3{font-size:19px}
.kcl-fm{font-size:15px}
.kcl-lab{padding:12px}
.kcl-list{flex-wrap:nowrap;overflow-x:auto;margin-bottom:12px}
.kcl-stage,.kcl-side{display:contents}
.kcl-cv{order:1}.kcl-ctrls{order:2}.kcl-outs{order:3}.kcl-note{order:4}.kcl-gr{order:5}
.kcl-grid{gap:10px}
}
</style>

/* ---------- بيانات كيميائية ---------- */
