function parseBulk(txt){
  var out=[];
  txt.replace(/\r/g,'').split(/\n\s*\n/).forEach(function(b){
    var lines=b.split('\n').map(function(s){return s.trim();}).filter(Boolean); if(!lines.length) return;
    var q={text:'',options:[],correct:0,time:20};
    lines.forEach(function(l){
      var m=l.match(/^([*\-\u2022+])\s*(.+)$/);
      if(m&&q.text){ if(q.options.length<4){ if(m[1]==='*'||m[1]==='+') q.correct=q.options.length; q.options.push(m[2].slice(0,120)); } }
      else { var t=l.replace(/^(\u0633|\u0633\u0624\u0627\u0644)?\s*[0-9\u0660-\u0669]*\s*[:.)\-]\s*/,''); q.text=q.text?q.text+' '+t:t; }
    });
    if(q.text&&q.options.length>=2){ while(q.options.length<4) q.options.push(''); q.text=q.text.slice(0,300); out.push(q); }
  });
  return out;
}

function compile(quiz){
  var qs=[], errs=[];
  if(!quiz.questions.length) errs.push('\u0623\u0636\u0641 \u0633\u0624\u0627\u0644\u0627\u064b \u0648\u0627\u062d\u062f\u0627\u064b \u0639\u0644\u0649 \u0627\u0644\u0623\u0642\u0644');
  quiz.questions.forEach(function(q,i){
    var opts=[], map={};
    q.options.forEach(function(o,j){ o=(o||'').trim(); if(o){ map[j]=opts.length; opts.push(o); } });
    if(!q.text.trim()) errs.push('\u0627\u0644\u0633\u0624\u0627\u0644 '+(i+1)+': \u0628\u0644\u0627 \u0646\u0635');
    else if(opts.length<2) errs.push('\u0627\u0644\u0633\u0624\u0627\u0644 '+(i+1)+': \u064a\u062d\u062a\u0627\u062c \u062e\u064a\u0627\u0631\u064a\u0646 \u0639\u0644\u0649 \u0627\u0644\u0623\u0642\u0644');
    else if(map[q.correct]===undefined) errs.push('\u0627\u0644\u0633\u0624\u0627\u0644 '+(i+1)+': \u0627\u0644\u0625\u062c\u0627\u0628\u0629 \u0627\u0644\u0635\u062d\u064a\u062d\u0629 \u0627\u0644\u0645\u062d\u062f\u062f\u0629 \u0641\u0627\u0631\u063a\u0629');
    else qs.push({text:q.text.trim(),options:opts,correct:map[q.correct],time:q.time||20});
  });
  return {qs:qs,errs:errs};
}

/* ---------- \u0627\u0644\u0645\u0639\u0644\u0651\u0645: \u0627\u0644\u063a\u0631\u0641\u0629 ---------- */
function hostStart(id){
  var quiz=getLib().filter(function(q){return q.id===id;})[0]; if(!quiz) return library();
  var c=compile(quiz);
  if(c.errs.length){ alert('\u0631\u0627\u062c\u0639 \u0627\u0644\u0645\u0633\u0627\u0628\u0642\u0629 \u0642\u0628\u0644 \u0627\u0644\u0628\u062f\u0621:\n\u2022 '+c.errs.slice(0,6).join('\n\u2022 ')); return editor(id); }
  if(!window.Peer){ alert('\u062a\u0639\u0630\u0651\u0631 \u062a\u062d\u0645\u064a\u0644 \u0645\u0643\u062a\u0628\u0629 \u0627\u0644\u0627\u062a\u0635\u0627\u0644. \u062a\u0623\u0643\u062f \u0645\u0646 \u0627\u0644\u0625\u0646\u062a\u0631\u0646\u062a \u062b\u0645 \u0623\u0639\u062f \u062a\u062d\u0645\u064a\u0644 \u0627\u0644\u0635\u0641\u062d\u0629.'); return; }
  stopAll();
  H={title:quiz.title||'\u0645\u0633\u0627\u0628\u0642\u0629',qs:c.qs,players:{},qi:-1,phase:'lobby',answers:{},tries:0,ui:{}};
  show(spinner('\u062c\u0627\u0631\u064d \u062a\u062c\u0647\u064a\u0632 \u0627\u0644\u063a\u0631\u0641\u0629\u2026'));
  wake(); openRoom();
}
function openRoom(){
  var my=H; H.code=String(Math.floor(100000+Math.random()*900000));
  var p=new Peer(PREFIX+H.code,{debug:0}); H.peer=p;
  p.on('open',function(){ if(H===my&&H.peer===p) hostLobby(); });
  p.on('connection',function(conn){
    conn.on('data',function(d){ if(H===my) hostData(conn,d); });
    conn.on('close',function(){ if(H===my) hostClose(conn); });
    conn.on('error',function(){ if(H===my) hostClose(conn); });
  });
  p.on('disconnected',function(){ setTimeout(function(){ if(H===my&&H.peer===p&&!p.destroyed){ try{p.reconnect();}catch(e){} } },1500); });
  p.on('error',function(e){
    if(H!==my||H.peer!==p) return;
    if(e.type==='unavailable-id'&&H.tries++<5){ p.destroy(); openRoom(); }
    else if(e.type==='peer-unavailable'){}
    else if(!H.ui.lobbyShown) show(header('\u062a\u0639\u0630\u0651\u0631 \u0641\u062a\u062d \u0627\u0644\u063a\u0631\u0641\u0629',library), h('div',{class:'kq-alert',text:'\u0644\u0645 \u0646\u0633\u062a\u0637\u0639 \u0627\u0644\u0627\u062a\u0635\u0627\u0644 \u0628\u062e\u0627\u062f\u0645 \u0627\u0644\u0631\u0628\u0637 ('+e.type+'). \u062a\u0623\u0643\u062f \u0645\u0646 \u0627\u0644\u0625\u0646\u062a\u0631\u0646\u062a \u062b\u0645 \u062d\u0627\u0648\u0644 \u0645\u0631\u0629 \u0623\u062e\u0631\u0649.'}));
    else toast('\u062a\u0646\u0628\u064a\u0647 \u0627\u062a\u0635\u0627\u0644: '+e.type);
  });
}
function joinLink(code){ return location.href.split('#')[0]+'#kq='+code; }
function plist(){ return Object.keys(H.players).map(function(k){return H.players[k];}); }
function onlineCount(){ return plist().filter(function(p){return p.online;}).length; }
function ranked(){ return plist().sort(function(a,b){return b.score-a.score||b.correct-a.correct||a.name.localeCompare(b.name,'ar');}); }
function send(p,m){ if(p.online&&p.conn&&p.conn.open){ try{p.conn.send(m);}catch(e){} } }
function broadcast(m){ plist().forEach(function(p){ send(p,typeof m==='function'?m(p):m); }); }
function qMsg(){

function endMsg(p,r){ r=r||ranked(); return {t:'end',rank:r.indexOf(p)+1,total:r.length,score:p.score,correct:p.correct,n:H.qs.length}; }
function syncPlayer(p){
  if(H.phase==='lobby') send(p,{t:'wait'});
  else if(H.phase==='ready') send(p,{t:'ready',i:H.qi,n:H.qs.length});
  else if(H.phase==='question') send(p,H.answers[p.cid]?{t:'got'}:qMsg());

function hostData(conn,d){
  if(!d||typeof d!=='object') return;

    var name=String(d.name||'').replace(/\s+/g,' ').trim().slice(0,20); cid=String(d.cid||'').slice(0,40);
    if(!name||!cid) return;
    var taken=plist().some(function(x){return x.cid!==cid&&x.name===name;});
    if(taken){ try{conn.send({t:'err',msg:'\u0627\u0644\u0627\u0633\u0645 \u00ab'+name+'\u00bb \u0645\u0633\u062a\u062e\u062f\u0645 \u0641\u064a \u0627\u0644\u063a\u0631\u0641\u0629. \u0627\u062e\u062a\u0631 \u0627\u0633\u0645\u0627\u064b \u0622\u062e\u0631 (\u0623\u0636\u0641 \u062d\u0631\u0641\u0627\u064b \u0623\u0648 \u0631\u0642\u0645\u0627\u064b).'});}catch(e){} return; }
    p=H.players[cid];

    var conn=peer.connect(PREFIX+code,{reliable:true}); S.conn=conn;
    conn.on('open',function(){ conn.send({t:'join',name:name,cid:cid,av:myAv()}); });
    conn.on('data',function(d){ if(S===my&&d&&typeof d==='object') studentData(d); });
    conn.on('close',function(){ if(S===my) lost(); });
  });
  peer.on('error',function(e){
    if(S!==my) return;
    if(e.type==='peer-unavailable') fail('\u0627\u0644\u0631\u0645\u0632 \u063a\u064a\u0631 \u0635\u062d\u064a\u062d \u0623\u0648 \u0623\u0646 \u0627\u0644\u0645\u0639\u0644\u0651\u0645 \u0623\u063a\u0644\u0642 \u0627\u0644\u063a\u0631\u0641\u0629.');
    else if(!S.joined) fail('\u062a\u0639\u0630\u0651\u0631 \u0627\u0644\u0627\u062a\u0635\u0627\u0644 ('+e.type+'). \u062a\u062d\u0642\u0642 \u0645\u0646 \u0627\u0644\u0625\u0646\u062a\u0631\u0646\u062a \u0648\u062d\u0627\u0648\u0644 \u0645\u062c\u062f\u062f\u0627\u064b.');
  });
}
function lost(){
  var c=S.code, n=S.name; stopAll();
  show(h('div',{class:'kq-s'}, h('div',{class:'kq-msg'},
    h('div',{class:'kq-big-ico',text:'\ud83d\udce1'}), h('h2',{text:'\u0627\u0646\u0642\u0637\u0639 \u0627\u0644\u0627\u062a\u0635\u0627\u0644'}),
    h('p',{class:'kq-muted',text:'\u0644\u0627 \u062a\u0642\u0644\u0642\u060c \u0646\u0642\u0627\u0637\u0643 \u0645\u062d\u0641\u0648\u0638\u0629 \u0644\u062f\u0649 \u0627\u0644\u0645\u0639\u0644\u0651\u0645. \u0623\u0639\u062f \u0627\u0644\u0627\u062a\u0635\u0627\u0644 \u0644\u0644\u0645\u062a\u0627\u0628\u0639\u0629.'}),
    h('div',{class:'kq-row',style:'justify-content:center'},
      h('button',{class:'kq-btn kq-gold kq-big',text:'\u21bb \u0625\u0639\u0627\u062f\u0629 \u0627\u0644\u0627\u062a\u0635\u0627\u0644',onclick:function(){connect(c,n);}}),
      h('button',{class:'kq-btn kq-ghost',text:'\u062e\u0631\u0648\u062c',onclick:home})))));
}
function sFrame(){
  var kids=[].slice.call(arguments);
  return h('div',{class:'kq-s'}, h('div',{class:'kq-sbar'}, h('span',{},avEl(myAv(),44),h('span',{class:'kq-ell',text:S.name})), h('b',{text:S.score+' \u0646\u0642\u0637\u0629'})), kids);
}
function sMsg(ico,title,sub){
  show(sFrame(h('div',{class:'kq-msg'}, h('div',{class:'kq-big-ico',text:ico}), h('h2',{text:title}), sub?h('p',{class:'kq-muted',text:sub}):null)));
}
function studentData(d){
  clearInterval(S.timer);
  var c;
  switch(d.t){
    case 'err': c=S.code; stopAll(); studentJoin(c,d.msg); break;
    case 'kick': c=S.code; stopAll(); studentJoin(c,'\u0623\u0632\u0627\u0644\u0643 \u0627\u0644\u0645\u0639\u0644\u0651\u0645 \u0645\u0646 \u0627\u0644\u063a\u0631\u0641\u0629.'); break;
    case 'welcome': S.joined=true; clearTimeout(S.to); S.name=d.name; S.score=d.score||0; break;
    case 'wait': if(!d.mid) S.score=0; sLobby(d.mid); break;
    case 'ready': sMsg('\u23f3','\u0627\u0633\u062a\u0639\u062f!','\u0627\u0644\u0633\u0624\u0627\u0644 '+(d.i+1)+' \u0645\u0646 '+d.n); beep(520,.08); break;
    case 'q': sQuestion(d); break;
    case 'got': sMsg('\ud83d\udce8','\u062a\u0645 \u0625\u0631\u0633\u0627\u0644 \u0625\u062c\u0627\u0628\u062a\u0643','\u0628\u0627\u0646\u062a\u0638\u0627\u0631 \u0627\u0646\u062a\u0647\u0627\u0621 \u0627\u0644\u0648\u0642\u062a\u2026 \u0627\u0646\u0638\u0631 \u0625\u0644\u0649 \u0627\u0644\u0634\u0627\u0634\u0629'); break;
    case 'res': sResult(d); break;
    case 'end': sEnd(d); break;
  }
}
function sLobby(mid){
  var my=S, tmr=null;
  show(sFrame(
    h('div',{class:'kq-msg',style:'padding:20px 10px 4px'},
      h('h2',{text:mid?'\u0623\u0646\u062a \u0641\u064a \u0627\u0644\u063a\u0631\u0641\u0629 \u2713':'\u062a\u0645 \u0627\u0644\u0627\u0646\u0636\u0645\u0627\u0645 \u2713'}),
      h('p',{class:'kq-muted',text:mid?'\u0627\u0646\u062a\u0638\u0631 \u0627\u0644\u0633\u0624\u0627\u0644 \u0627\u0644\u062a\u0627\u0644\u064a\u2026 \u0648\u064a\u0645\u0643\u0646\u0643 \u062a\u0639\u062f\u064a\u0644 \u0634\u062e\u0635\u064a\u062a\u0643.':'\u0627\u0633\u0645\u0643 \u0648\u0634\u062e\u0635\u064a\u062a\u0643 \u0638\u0627\u0647\u0631\u0627\u0646 \u0639\u0644\u0649 \u0634\u0627\u0634\u0629 \u0627\u0644\u0645\u0639\u0644\u0651\u0645. \u0639\u062f\u0651\u0644 \u0634\u062e\u0635\u064a\u062a\u0643 \u062d\u062a\u0649 \u062a\u0628\u062f\u0623 \u0627\u0644\u0645\u0633\u0627\u0628\u0642\u0629!'})),
    avBuilder(function(av){
      var bar=VIEW.querySelector('.kq-sbar .kq-avw'); if(bar) bar.innerHTML=avSvg(av,44);
      clearTimeout(tmr);
      tmr=setTimeout(function(){ if(S===my&&S.conn&&S.conn.open){ try{S.conn.send({t:'av',av:av});}catch(e){} } },300);
    })));
}
function sQuestion(d){
  var end=Date.now()+d.left, sent=false;
  var t=h('span',{class:'kq-stime',text:Math.ceil(d.left/1000)});
  show(sFrame(
    h('div',{class:'kq-sq-head'}, h('span',{text:'\u0633\u0624\u0627\u0644 '+(d.i+1)+' / '+d.n}), t),
    h('div',{class:'kq-sq-text',text:d.text}),
    h('div',{class:'kq-grid kq-sgrid'}, d.options.map(function(o,j){
      return h('button',{class:'kq-opt kq-c'+j,onclick:function(){
        if(sent) return; sent=true;
        try{ S.conn.send({t:'answer',q:d.i,a:j}); }catch(e){}
        if(navigator.vibrate) navigator.vibrate(30);
        beep(660,.07);
        sMsg('\ud83d\udce8','\u062a\u0645 \u0625\u0631\u0633\u0627\u0644 \u0625\u062c\u0627\u0628\u062a\u0643','\u0628\u0627\u0646\u062a\u0638\u0627\u0631 \u0627\u0646\u062a\u0647\u0627\u0621 \u0627\u0644\u0648\u0642\u062a\u2026');
      }}, h('span',{class:'kq-shape',text:SHAPES[j]}), h('span',{text:o}));
    }))));
  S.timer=setInterval(function(){
    var l=end-Date.now(); t.textContent=Math.max(0,Math.ceil(l/1000));
    if(l<=0){ clearInterval(S.timer); if(!sent){ sent=true; sMsg('\u231b','\u0627\u0646\u062a\u0647\u0649 \u0627\u0644\u0648\u0642\u062a','\u0628\u0627\u0646\u062a\u0638\u0627\u0631 \u0627\u0644\u0646\u062a\u064a\u062c\u0629\u2026'); } }
  },250);
}
function sResult(d){
  S.score=d.score;
  var cls=d.ok?'ok':'bad';
  show(sFrame(h('div',{class:'kq-res '+cls},
    h('div',{class:'kq-big-ico',style:'font-size:84px',text:d.ok?'\u2705':(d.answered?'\u274c':'\u231b')}),
    h('h2',{text:d.ok?'\u0625\u062c\u0627\u0628\u0629 \u0635\u062d\u064a\u062d\u0629!':(d.answered?'\u0625\u062c\u0627\u0628\u0629 \u062e\u0627\u0637\u0626\u0629':'\u0644\u0645 \u062a\u064f\u062c\u0628 \u0641\u064a \u0627\u0644\u0648\u0642\u062a')}),
    d.ok?h('div',{class:'kq-gain',text:'+'+d.gained}):h('p',{class:'kq-muted',text:'\u0627\u0644\u0625\u062c\u0627\u0628\u0629 \u0627\u0644\u0635\u062d\u064a\u062d\u0629: '+d.correctText}),
    d.streak>=2?h('p',{text:'\ud83d\udd25 '+d.streak+' \u0625\u062c\u0627\u0628\u0627\u062a \u0635\u062d\u064a\u062d\u0629 \u0645\u062a\u062a\u0627\u0644\u064a\u0629'}):null,
    h('div',{class:'kq-rk',text:'\u062a\u0631\u062a\u064a\u0628\u0643: '+d.rank+' \u0645\u0646 '+d.total}),
    h('p',{class:'kq-muted',text:d.rank===1?'\u0623\u0646\u062a \u0641\u064a \u0627\u0644\u0635\u062f\u0627\u0631\u0629! \u062d\u0627\u0641\u0638 \u0639\u0644\u064a\u0647\u0627':'\u0627\u0633\u062a\u0645\u0631\u2026 \u0627\u0644\u0633\u0624\u0627\u0644 \u0627\u0644\u0642\u0627\u062f\u0645 \u0641\u0631\u0635\u062a\u0643'}))));
  if(d.ok){ beep(660,.12); setTimeout(function(){beep(880,.18);},130); if(navigator.vibrate) navigator.vibrate(60); }
  else { beep(220,.3); if(navigator.vibrate) navigator.vibrate([80,60,80]); }
}
function sEnd(d){
  S.score=d.score;
  var medal=['\ud83e\udd47','\ud83e\udd48','\ud83e\udd49'][d.rank-1]||'\ud83c\udfaf';
  show(sFrame(h('div',{class:'kq-msg'},
    avEl(myAv(),150),
    h('div',{class:'kq-big-ico',style:'font-size:56px;margin-top:-10px',text:medal}),
    h('h2',{text:d.rank<=3?'\u0645\u0628\u0631\u0648\u0643! \u0627\u0644\u0645\u0631\u0643\u0632 '+d.rank:'\u0627\u0646\u062a\u0647\u062a \u0627\u0644\u0645\u0633\u0627\u0628\u0642\u0629'}),
    h('p',{style:'font-size:1.2em;font-weight:700',text:'\u062a\u0631\u062a\u064a\u0628\u0643 '+d.rank+' \u0645\u0646 '+d.total+' \u00b7 '+d.score+' \u0646\u0642\u0637\u0629'}),
    h('p',{class:'kq-muted',text:'\u0623\u062c\u0628\u062a \u0625\u062c\u0627\u0628\u0629 \u0635\u062d\u064a\u062d\u0629 \u0639\u0646 '+d.correct+' \u0645\u0646 '+d.n+' \u0623\u0633\u0626\u0644\u0629'}),
    h('div',{class:'kq-row',style:'justify-content:center'}, h('button',{class:'kq-btn',text:'\u062e\u0631\u0648\u062c',onclick:home})))));
}

/* ---------- \u0627\u0644\u0628\u062f\u0621 ---------- */
var m=location.hash.match(/kq=(\d{6})/);
if(m) studentJoin(m[1]); else home();
})();
</script>
