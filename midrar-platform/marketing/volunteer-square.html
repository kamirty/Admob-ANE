<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@600;800;900&display=swap"><style>
*{margin:0;box-sizing:border-box}
body{font-family:Cairo,sans-serif;color:#F4F6F1;background:#0F2A22;overflow:hidden;position:relative}
.bg{position:absolute;inset:0;background:
 radial-gradient(760px 560px at 85% 8%,rgba(91,195,154,.25),transparent 70%),
 radial-gradient(700px 520px at 5% 100%,rgba(231,180,86,.16),transparent 70%)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.5px);background-size:34px 34px;mask-image:linear-gradient(180deg,#000,transparent 70%)}
.wrap{position:relative;height:100%;display:grid;justify-items:center;text-align:center}
.logo{height:var(--logo)}
.kick{display:inline-block;border:2px solid rgba(231,180,86,.7);color:#E7B456;border-radius:999px;font-weight:800;font-size:var(--kick);padding:6px 30px}
h1{font-weight:900;font-size:var(--h1);line-height:1.15;letter-spacing:0}
h1 b{color:#5BC39A;font-weight:900}
.sub{font-size:var(--sub);color:#CFE0D8;line-height:1.6;font-weight:600}
.faces{display:flex;justify-content:center;direction:rtl}
.face{width:var(--face);height:var(--face);border-radius:50%;overflow:hidden;background:#E6F0EC;border:5px solid #0F2A22;margin-inline-start:calc(var(--face) * -0.16);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.face:first-child{margin-inline-start:0}
.face svg{width:100%;height:100%;display:block}
.face.you{background:#E7B456;color:#0F2A22;font-weight:900;font-size:calc(var(--face) * .26)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;width:100%}
.st{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:20px 14px;display:grid;gap:6px;justify-items:center}
.st i{font-style:normal;width:var(--num);height:var(--num);border-radius:50%;background:#5BC39A;color:#0A1A13;font-weight:900;font-size:calc(var(--num) * .5);display:grid;place-items:center}
.st b{font-size:var(--stb);font-weight:800;line-height:1.35}
.cta{display:flex;gap:22px;align-items:center;justify-content:center;flex-wrap:wrap}
.btn{background:#E7B456;color:#0F2A22;font-weight:900;font-size:var(--btn);border-radius:18px;padding:12px 44px}
.url{font-size:var(--url);font-weight:800;direction:ltr;color:#F4F6F1}
.foot{font-size:var(--foot);color:#9DB8AE;font-weight:600}
.hadith{font-family:Amiri,serif;font-size:var(--had);color:#E7B456;line-height:1.7}

body{width:1080px;height:1080px;--logo:84px;--kick:30px;--h1:96px;--sub:34px;--face:132px;--num:50px;--stb:28px;--btn:40px;--url:36px;--foot:26px}
.wrap{padding:56px 70px 50px;align-content:space-between}
