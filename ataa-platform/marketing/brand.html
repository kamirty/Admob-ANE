<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@600;800;900&display=swap">
<style>
*{margin:0;box-sizing:border-box}
body{background:#F4F6F1;color:#1D5C4A;font-family:Cairo,sans-serif;overflow:hidden}
.av{width:1080px;height:1080px;display:grid;place-items:center;background:#FFFFFF}
.av img{width:780px}
.bn{display:flex;align-items:center;justify-content:center;gap:5%;background:#F4F6F1;
 background-image:radial-gradient(60% 80% at 50% 50%,#FFFFFF,transparent 75%)}
.bn img{flex:none}
.bn .txt{display:grid;gap:.35em;text-align:right}
.bn .slogan{font-family:Amiri,serif;font-weight:700;color:#B9770E}
.bn .desc{color:#56676A;font-weight:600}
.bn .url{color:#1D5C4A;font-weight:800;direction:ltr;text-align:right}
.bn .line{height:4px;width:120px;background:#E7B456;border-radius:2px}
</style></head><body><div id="root"></div>
<script>
const mode=location.hash.slice(1), r=document.getElementById('root');
if(mode==='avatar'){document.body.style.cssText='width:1080px;height:1080px';
 r.innerHTML='<div class="av"><img src="midrar-logo-official.svg" alt=""></div>';}
else{const [w,h,k]=mode==='youtube'?[2560,1440,1]:[1500,500,0.62];
 document.body.style.cssText=`width:${w}px;height:${h}px`;
 r.innerHTML=`<div class="bn" style="width:${w}px;height:${h}px">
  <img src="midrar-logo-official.svg" alt="" style="height:${mode==='youtube'?560:400}px">
  <div class="txt" style="font-size:${40*k}px">
   <div class="slogan" style="font-size:${84*k}px">علمٌ مِدْرار… وأجرٌ يبقى</div><div class="line"></div>
   <div class="desc">حصص مجانية مباشرة يقدّمها معلمون متطوعون<br>من الصف 1 إلى 12 · سلطنة عُمان</div>
   <div class="url">www.midrarelm.com</div></div></div>`;}
</script></body></html>
