<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@600;800&display=swap">
<style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1080px;background:#0F2A22;display:grid;place-items:center;font-family:Amiri,serif;color:#F4F6F1;
background-image:radial-gradient(700px 500px at 50% 35%,rgba(91,195,154,.18),transparent 70%)}
.frame{width:940px;height:940px;border:2px solid rgba(231,180,86,.55);border-radius:28px;padding:18px}
.inner{height:100%;border:1px solid rgba(231,180,86,.3);border-radius:20px;display:grid;justify-items:center;align-content:center;gap:22px;padding:40px 60px;text-align:center}
.orn{color:#E7B456;font-size:40px;letter-spacing:.6em}
.say{font-size:44px;color:#B9CCC4}
.q{font-size:58px;font-weight:700;line-height:1.85}
.q b{color:#5BC39A;font-weight:700}
.src{font-size:40px;color:#B9CCC4}
.brand{font-family:Cairo,sans-serif;font-weight:800;font-size:30px;color:#E7B456;margin-top:10px}
.brand span{color:#B9CCC4;font-weight:600}
</style></head><body>
<div class="frame"><div class="inner">
<div class="orn">❁ ❁ ❁</div>
<div class="say">قال رسول الله ﷺ</div>
<div class="q">«إذا مات ابنُ آدمَ انقطع عملُه<br>إلا من ثلاث: صدقةٍ جارية،<br>أو <b>علمٍ يُنتفَعُ به</b>،<br>أو ولدٍ صالحٍ يدعو له»</div>
<div class="src">رواه مسلم</div>
<div class="say" style="color:#5BC39A;font-weight:700">والعلمُ النافع هو الأثرُ الأبقى</div>
<div class="brand">منصة أبقى <span>· علمٌ يُنشر… وأجرٌ يبقى · edu.kamirtyai.com</span></div>
</div></div></body></html>
